<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>健保申請登錄</title>
<meta name="theme-color" content="#0f766e">
<style>
:root{
  --bg:#f3f4f2;--surface:#ffffff;--surface2:#f8f9f7;--border:#d9ddd8;
  --text:#1f2937;--text2:#374151;--muted:#6b7280;--faint:#9ca3af;
  --primary:#0f766e;--primary-d:#115e59;--primary-soft:#e6f4f1;--primary-rgb:15,118,110;
  --ok:#15803d;--ok-soft:#e7f5ea;--warn:#b45309;--warn-soft:#fdf3e3;--danger:#b91c1c;--danger-soft:#fbe9e9;
  --radius:12px;--fs:17px;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.45;padding-bottom:6rem}
header{background:var(--primary);color:#f0fdfa;padding:.7rem 1rem;display:flex;align-items:center;gap:.6rem;position:sticky;top:0;z-index:5}
header h1{font-size:1.05rem;margin:0;font-weight:600;flex:1}
header button{background:rgba(255,255,255,.15);border:0;color:#f0fdfa;border-radius:8px;padding:.35rem .6rem;font-size:.9rem}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
.tabs button{flex:1;border:0;background:none;padding:.7rem;font-size:1rem;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
main{max-width:640px;margin:0 auto;padding:.9rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem;margin-bottom:.9rem}
label.l{display:block;font-size:.9rem;color:var(--muted);margin:.2rem 0 .3rem}
input[type=text],input[type=search],textarea{width:100%;font-size:1.05rem;padding:.6rem .7rem;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text)}
input:focus,textarea:focus{outline:2px solid rgba(var(--primary-rgb),.35);border-color:var(--primary)}
.big{font-size:1.5rem !important;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0}
.chip{border:1px solid var(--border);background:var(--surface2);color:var(--text2);border-radius:999px;padding:.4rem .8rem;font-size:.95rem;cursor:pointer;user-select:none}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip.sel{background:var(--primary-soft);color:var(--primary-d);border-color:var(--primary);font-weight:600}
.chip .x{margin-left:.3rem;opacity:.7}
.list{max-height:15rem;overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-top:.4rem}
.list div{padding:.55rem .7rem;border-bottom:1px solid var(--border);cursor:pointer}
.list div:last-child{border-bottom:0}
.list div:active{background:var(--primary-soft)}
.list small{color:var(--muted);display:block;font-size:.8rem}
.list .pa{color:var(--warn);font-size:.75rem;margin-left:.3rem}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface2);padding:.7rem;font-size:1.05rem;color:var(--text2)}
.seg button.on{background:var(--primary);color:#fff;font-weight:600}
.submit{position:fixed;left:0;right:0;bottom:0;padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.submit button{width:100%;max-width:640px;display:block;margin:0 auto;font-size:1.2rem;padding:.9rem;border:0;border-radius:14px;background:var(--primary);color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(var(--primary-rgb),.35)}
.submit button:disabled{background:var(--faint);box-shadow:none}
.note{font-size:.85rem;color:var(--muted)}
.toast{position:fixed;top:4.2rem;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:.7rem 1.1rem;border-radius:10px;font-size:1rem;z-index:9;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:90vw}
.toast.err{background:var(--danger)}
.toast.warn{background:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:.45rem .4rem;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem}
.st{display:inline-block;padding:.1rem .5rem;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.st-wait{background:var(--warn-soft);color:var(--warn)}
.st-sent{background:var(--primary-soft);color:var(--primary-d)}
.st-ok{background:var(--ok-soft);color:var(--ok)}
.st-no{background:var(--danger-soft);color:var(--danger)}
.st-q{background:var(--danger-soft);color:var(--danger)}
.flag{display:inline-block;padding:.05rem .4rem;border-radius:6px;font-size:.75rem;font-weight:600;margin-left:.25rem;white-space:nowrap}
.flag-exp{background:var(--warn-soft);color:var(--warn)}
.flag-over{background:var(--danger-soft);color:var(--danger)}
.flag-new{background:var(--primary-soft);color:var(--primary-d)}
.row{display:flex;gap:.6rem;align-items:center}
.row>*{flex:1}
.btn2{border:1px solid var(--border);background:var(--surface);color:var(--primary-d);border-radius:10px;padding:.5rem .8rem;font-size:.95rem}
.btnR{border:0;background:var(--primary);color:#fff;border-radius:8px;padding:.35rem .6rem;font-size:.85rem;font-weight:600;white-space:nowrap}
.hid{display:none}
.badge{background:var(--danger);color:#fff;border-radius:999px;padding:0 .45rem;font-size:.75rem;margin-left:.3rem}
.btn-cap{display:block;text-align:center;background:var(--primary);color:#fff;border-radius:12px;padding:.75rem;font-size:1.05rem;font-weight:700;cursor:pointer;flex:1}
.cap-ok{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ok);border-radius:10px;padding:.6rem .7rem;font-size:1rem}
.cap-bad{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:.6rem .7rem;font-size:1rem}
.cap-ok b,.cap-bad b{font-size:1.35rem;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.mrn-ocr{border-color:var(--ok) !important;background:var(--ok-soft) !important}
.toggle{background:none;border:0;color:var(--primary-d);font-size:.95rem;padding:.2rem 0;cursor:pointer}
dialog{border:0;border-radius:var(--radius);padding:1rem;max-width:520px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.35)}
</style>
</head>
<body>
<header>
  <h1>健保事前審查 · 門診登錄</h1>
  <button id="btnDoc" title="切換登錄醫師">👤 未選醫師</button>
  <button id="btnQueue" class="hid" title="待重送">待送<span class="badge" id="qn">0</span></button>
  <button id="btnSet" title="設定">⚙</button>
</header>
<div class="tabs">
  <button class="on" data-tab="form">登錄</button>
  <button data-tab="list">清單<span class="badge hid" id="listBadge">0</span></button>
</div>

<main id="tab-form">
  <div class="card" id="capCard">
    <div class="row">
      <label class="btn-cap" for="capFile">📷 拍 / 貼 HIS 畫面，自動讀病歷號</label>
      <input type="file" id="capFile" accept="image/*" capture="environment" class="hid">
    </div>
    <div class="note" id="capHint" style="margin-top:.45rem">辨識在手機內完成，影像不會上傳。電腦上可用 Win+Shift+S 截圖後在此頁按 Ctrl+V。</div>
    <div id="capResult" class="hid" style="margin-top:.6rem">
      <img id="capBand" alt="擷取到的病歷號那一行" style="width:100%;border-radius:8px;border:1px solid var(--border)">
      <div id="capVerdict" style="margin-top:.5rem"></div>
      <div class="row" style="margin-top:.5rem"><button class="btn2 hid" id="capConfirm" style="background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700">核對無誤，填入</button><button class="btn2" id="capRetry">重拍</button><button class="btn2" id="capManual">手動輸入</button></div>
    </div>
  </div>

  <div class="card">
    <label class="l">病歷號 *</label>
    <input type="text" id="mrn" class="big" inputmode="numeric" pattern="[0-9]*" placeholder="例 14408593" autocomplete="off" autofocus>
    <div class="row" style="margin-top:.6rem">
      <div><label class="l">姓名（可留空）</label><input type="text" id="pname" autocomplete="off"></div>
      <div><label class="l">類型</label>
        <div class="seg"><button id="tFirst" class="on">初次</button><button id="tRenew">續用</button></div></div>
    </div>
  </div>

  <div class="card">
    <label class="l">申請藥物 *（可多選，如併用）</label>
    <div class="chips" id="selDrugs"></div>
    <div class="chips" id="recent"></div>
    <input type="search" id="q" placeholder="搜學名 / 商品名，如 nivo、Keytruda" autocomplete="off">
    <div class="list" id="dl"></div>
    <div class="row" style="margin-top:.5rem">
      <button class="toggle" id="cancerToggle">篩癌別 ▾</button>
      <span class="note" id="cancerSel" style="text-align:right"></span>
    </div>
    <div class="chips hid" id="cancers"></div>
  </div>

  <div class="card">
    <label class="l">備註（PD-L1、線別、生物標記、其他要行政注意的事）</label>
    <textarea id="memo" rows="2" placeholder="例：PD-L1 TC 20%；二線；CT PR"></textarea>
    <div class="note" style="margin-top:.4rem">送出後行政端清單立即出現，並寄 email 通知。病歷內容由行政人員自行從 HIS 調閱。</div>
  </div>
</main>

<main id="tab-list" class="hid">
  <div class="card">
    <div class="row"><b>申請清單</b><button class="btn2" id="btnReload" style="flex:0 0 auto">重新整理</button></div>
    <div class="chips" id="lf" style="margin-top:.4rem">
      <span class="chip on" data-f="active">進行中</span><span class="chip" data-f="核准">核准</span><span class="chip" data-f="">全部</span>
    </div>
    <div class="note" id="listNote" style="margin:.4rem 0"></div>
    <div style="overflow-x:auto"><table id="tbl"><thead><tr><th>#</th><th>日期</th><th>病歷號</th><th>藥物</th><th>類型</th><th>狀態</th><th>有效期至</th><th></th></tr></thead><tbody></tbody></table></div>
    <div class="note" style="margin-top:.5rem">標記：<span class="flag flag-new">有更新</span> 上次看過後狀態改變　<span class="flag flag-exp">即將到期</span> 有效期 30 天內　<span class="flag flag-over">逾期</span> 已送審超過 14 天未回覆</div>
  </div>
</main>

<div class="submit" id="submitBar"><button id="btnSubmit" disabled>送出登錄</button></div>

<dialog id="dlgDoc">
  <h3 style="margin:.2rem 0 .3rem">醫師登入</h3>
  <div class="note" style="margin-bottom:.6rem">輸入姓名與 PIN 碼登入一次，此裝置會記住；案件記在您名下，清單也只顯示自己的案件。PIN 碼向行政索取。</div>
  <label class="l">姓名</label><input type="text" id="docName" placeholder="例 林振源" autocomplete="off">
  <label class="l">PIN 碼</label><input type="password" id="docPin" inputmode="numeric" autocomplete="current-password">
  <div class="row" style="margin-top:.8rem"><button class="btn2" id="docCancel">取消</button><button class="btn2" id="docLogin" style="background:var(--primary);color:#fff;border-color:var(--primary)">登入</button></div>
  <div class="note" id="docNote" style="margin-top:.5rem"></div>
</dialog>

<dialog id="dlg">
  <h3 style="margin:.2rem 0 .6rem">設定</h3>
  <label class="l">後端 URL（GAS /exec）</label>
  <input type="text" id="sUrl" placeholder="https://script.google.com/macros/s/.../exec">
  <label class="l">共用密碼</label>
  <input type="text" id="sSecret">
  <div class="note" id="sTestNote" style="margin-top:.5rem"></div>
  <div class="row" style="margin-top:.8rem"><button class="btn2" id="sTest">測試連線</button><button class="btn2" id="sReset">恢復預設</button></div>
  <div class="row" style="margin-top:.5rem"><button class="btn2" id="sCancel">取消</button><button class="btn2" id="sSave" style="background:var(--primary);color:#fff;border-color:var(--primary)">儲存</button></div>
</dialog>

function doLogin(){
  var n=$('#docName').value.trim(),p=$('#docPin').value.trim();
  if(!n||!p){$('#docNote').textContent='請輸入姓名與 PIN 碼';return}
  if(!validUrl(gasUrl())){$('#docNote').textContent='尚未設定後端 URL（⚙）';return}
  $('#docLogin').disabled=true;$('#docNote').textContent='登入中…';
  post({action:'login_doc',secret:secret(),name:n,pin:p}).then(function(r){
    if(r.status!=='ok'){
      var msg=r.message==='bad pin'?('PIN 碼錯誤'+(r.left!==undefined?'，再錯 '+r.left+' 次將鎖定':'')):
              r.message==='locked'?('嘗試過多，請 '+(r.minutes||15)+' 分鐘後再試'):
              r.message==='no pin set'?'尚未設定 PIN 碼，請向行政索取':
              r.message==='no such doctor'?'名單中查無此姓名，請確認或洽行政':r.message;
      $('#docNote').textContent=msg;return;
    }
    auth={name:r.name,token:r.token};LS.set('nhirx.doc',auth);
    renderDoc();$('#dlgDoc').close();validate();toast('已登入：'+r.name+(r.dept?'（'+r.dept+'）':''));
    if(!$('#tab-list').classList.contains('hid'))loadList();
  }).catch(function(e){$('#docNote').textContent='連線失敗：'+e.message})
  .finally(function(){$('#docLogin').disabled=false});
}

function matches(d,q){q=q.toLowerCase();return !q||d.g.toLowerCase().indexOf(q)>=0||d.b.toLowerCase().indexOf(q)>=0}
function renderList(){
  var q=$('#q').value.trim();var box=$('#dl');box.innerHTML='';
  var arr=DRUGS.filter(function(d){return matches(d,q)&&(!state.cancer||d.c.indexOf(state.cancer)>=0)});
  if(!q&&!state.cancer){box.innerHTML='<div class="note" style="cursor:default">點上方常用藥，或輸入關鍵字 / 篩癌別列出藥物。</div>';return}
  if(!arr.length){box.innerHTML='<div class="note" style="cursor:default">找不到，可改用「其他」直接輸入藥名。</div>'}
  arr.slice(0,60).forEach(function(d){var el=document.createElement('div');
    el.innerHTML='<b>'+esc(d.g)+'</b>'+(d.p?'<span class="pa">需事前審查</span>':'')+'<small>'+esc(d.b||'')+(d.c.length?' · '+esc(d.c.slice(0,4).join('/')):'')+'</small>';
    el.onclick=function(){addDrug(d.g)};box.appendChild(el)});
  var other=document.createElement('div');other.innerHTML='<b>其他：'+esc(q||'（輸入藥名）')+'</b><small>不在第9節清單，直接以輸入文字登錄</small>';
  other.onclick=function(){if(q)addDrug(q)};box.appendChild(other);
}
function addDrug(n){if(state.drugs.indexOf(n)<0)state.drugs.push(n);$('#q').value='';renderSel();renderList();validate()}

/* ---- validate / submit ---- */
function validate(){var ok=/^\d{5,10}$/.test($('#mrn').value.trim())&&state.drugs.length>0&&!!docToken();$('#btnSubmit').disabled=!ok;$('#btnSubmit').textContent=docToken()?'送出登錄':'請先登入醫師身分';return ok}
$('#mrn').oninput=validate;

function payload(){return{action:'submit',secret:secret(),doc_token:docToken(),mrn:$('#mrn').value.trim(),name:$('#pname').value.trim(),cancer:state.cancer||'',
  drugs:state.drugs.join(' + '),type:state.type,memo:$('#memo').value.trim(),client_ts:new Date().toISOString(),
  nonce:Date.now().toString(36)+Math.random().toString(36).slice(2,8)}}

function post(body,attempt){
  attempt=attempt||0;
  return fetch(gasUrl(),{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain;charset=utf-8'}})
    .then(function(r){return r.text()}).then(function(t){var j;try{j=JSON.parse(t)}catch(e){throw new Error('回應非 JSON：'+t.slice(0,80))}
      if(j&&j.message==='busy, retry'&&attempt<3){return new Promise(function(res){setTimeout(res,1500*(attempt+1))}).then(function(){return post(body,attempt+1)})}
      return j});
}
var busy=false;
function sendCase(p,onDone){
  return post(p).then(function(r){
    if(r.status!=='ok'&&r.message==='login required'){needLogin();if(onDone)onDone(null);return}
    if(r.status!=='ok')throw new Error(r.message||'伺服器拒絕');
    toast('已登錄 #'+r.id+'　'+p.mrn+'　'+p.drugs+(r.dup?'（重複，沿用原編號）':''));
    remember(p);if(onDone)onDone(r);
  }).catch(function(e){queue(p);toast('送出失敗，已存待送：'+e.message,'err');if(onDone)onDone(null)});
}
$('#btnSubmit').onclick=function(){
  if(!docToken()){openDocDialog();return}
  if(busy||!validate())return;
  if(!validUrl(gasUrl())){toast('尚未設定後端 URL（⚙），先存入待送','warn');queue(payload());resetForm();return}
  busy=true;$('#btnSubmit').disabled=true;$('#btnSubmit').textContent='送出中…';
  sendCase(payload(),function(){resetForm()}).finally(function(){busy=false;$('#btnSubmit').textContent='送出登錄'});
};
function remember(p){var r=LS.get('nhirx.recent',[]);p.drugs.split(' + ').forEach(function(n){r=[n].concat(r.filter(function(x){return x!==n}))});LS.set('nhirx.recent',r.slice(0,10));renderRecent();
  var local=LS.get('nhirx.today',[]);local.unshift({ts:p.client_ts,mrn:p.mrn,drugs:p.drugs,type:p.type});LS.set('nhirx.today',local.slice(0,50))}
function resetForm(){$('#mrn').value='';$('#pname').value='';$('#memo').value='';state.drugs=[];renderSel();validate();$('#mrn').focus()}

/* ---- offline queue ---- */
function queue(p){var q=LS.get('nhirx.queue',[]);q.push(p);LS.set('nhirx.queue',q);renderQueue()}
function renderQueue(){var q=LS.get('nhirx.queue',[]);$('#qn').textContent=q.length;$('#btnQueue').classList.toggle('hid',!q.length)}
$('#btnQueue').onclick=flush;
function flush(){var q=LS.get('nhirx.queue',[]);if(!q.length)return;if(!validUrl(gasUrl())){toast('先在 ⚙ 設定後端 URL','warn');return}
  if(!docToken()){toast('請先登入醫師身分再補送','warn');openDocDialog();return}
  var p=q[0];p.secret=secret();p.doc_token=docToken();
  post(p).then(function(r){if(r.status!=='ok')throw new Error(r.message||'拒絕');q.shift();LS.set('nhirx.queue',q);remember(p);renderQueue();toast('補送成功 #'+r.id);if(q.length)flush()})
  .catch(function(e){toast('補送失敗：'+e.message,'err')})}
window.addEventListener('online',function(){if(LS.get('nhirx.queue',[]).length)flush()});

/* ---- list: lifecycle flags + renewal ---- */
function daysFrom(iso){if(!iso)return null;var d=new Date(iso+'T00:00:00');if(isNaN(d))return null;return Math.round((d-new Date().setHours(0,0,0,0))/86400000)}
function flagsFor(r){
  var f=[];
  if(r.status==='核准'&&r.valid){var n=daysFrom(r.valid);if(n!==null&&n<0)f.push(['flag-exp','已到期']);else if(n!==null&&n<=EXPIRE_DAYS)f.push(['flag-exp','即將到期 '+n+'天'])}
  if(r.status==='已送審'&&r.sent){var m=daysFrom(r.sent);if(m!==null&&-m>OVERDUE_DAYS)f.push(['flag-over','逾期 '+(-m)+'天'])}
  var seen=LS.get('nhirx.seen',{});if(seen[r.id]&&seen[r.id]!==r.status)f.push(['flag-new','有更新']);
  return f;
}
function stClass(s){return s==='待送'?'st-wait':s==='已送審'?'st-sent':/核准|結案/.test(s)?'st-ok':/駁回/.test(s)?'st-no':/補件/.test(s)?'st-q':''}
function loadList(){
  var tb=$('#tbl tbody');tb.innerHTML='';$('#listNote').textContent='';

  if(!docToken()){$('#listNote').textContent='請先登入醫師身分（右上 👤）。';return}
  $('#listNote').textContent='載入中…';
  post({action:'list',secret:secret(),limit:300,doc_token:docToken()}).then(function(r){

}

/* ===================================================================
   截圖／拍照讀病歷號（裝置內辨識，影像不上傳）
   規格不符就立刻請重拍，寧可要求重拍也不靜默填錯。
   門檻依 12 張實測照片校準：至少 2 組前處理在方括號內讀到相同數字，
   該規則在測試集上被接受的讀取 100% 正確。
   =================================================================== */
var CAP = {
  /* 文字高度只當診斷用，不當硬性門檻：手機拍照的字在畫面中很大(60-130px)，
     電腦截圖的字在像素上很小(15-22px)卻銳利且辨識率更高。真正的把關是下面的票數一致性。 */
  /* 實測：原生 9px 的清晰截圖仍可讀對（6 組中 3 組以上一致），8px 以下才真的讀不出來。
     把關交給票數一致性，尺寸只擋顯然無望的，不要提前拒絕還有機會的影像。 */
  HARD_MIN_TEXT_H: 7,  // 低於此完全無法辨識，直接請重拍
  SMALL_TEXT_H: 12,    // 低於此且辨識失敗時才提示「放大再截圖」
  MIN_AGREE: 3,        // 六組前處理中至少幾組在方括號內讀到「相同」數字
  NO_DISSENT: true,    // 且不得有其他組讀到不同數字
  MIN_DIGITS: 5, MAX_DIGITS: 10,
  worker: null, tries: 0, busy: false, pending: ''
};
function capWorker(){
  if(CAP.worker) return CAP.worker;
  if(typeof Tesseract === 'undefined') return Promise.reject(new Error('辨識元件未載入（需連網一次）'));
  CAP.worker = Tesseract.createWorker('eng', 1, {logger:function(m){
    if(m.status==='recognizing text') capSay('辨識中 '+Math.round(m.progress*100)+'%');
  }}).then(function(w){ return w.setParameters({tessedit_char_whitelist:'0123456789[]()'}).then(function(){return w}) });
  return CAP.worker;
}
function capSay(msg, kind){
  var v=$('#capVerdict');
  v.className = kind==='ok' ? 'cap-ok' : (kind==='bad' ? 'cap-bad' : 'note');
  v.innerHTML = msg;
}
/* 找出藍綠色標題列裡的黃色字（病歷號那一行）。
   定位用縮圖（快），但裁切一律回原圖的原生解析度——縮圖裁切會先把筆畫細節丟掉，
   這正是最初實驗 2/12 的原因，不可重蹈。 */
function capFindBand(img){
  var W = Math.min(1600, img.width), sc = W/img.width;   // 只縮不放，供定位用
  var cw = Math.round(img.width*sc), ch = Math.round(img.height*sc);
  var small = document.createElement('canvas'); small.width=cw; small.height=ch;
  small.getContext('2d').drawImage(img,0,0,cw,ch);
  var ctx = small.getContext('2d');
  var d, p;
  try { d = ctx.getImageData(0,0,cw,ch); p = d.data; }
  catch(e){ return {err:'no_header'}; }
  var rc = new Int32Array(ch), mx = 0;
  for(var y=0;y<ch;y++){
    var n=0, base=y*cw*4;
    for(var x=0;x<cw;x++){
      var i=base+x*4, r=p[i], g=p[i+1], b=p[i+2];
      if(r>140 && g>130 && b<130 && ((r+g)/2-b)>60) n++;
    }
    rc[y]=n; if(n>mx) mx=n;
  }
  if(mx < 8) return {err:'no_header'};
  /* 收集所有黃字橫帶，取「黃色像素總量最大」的那一帶：病歷號那一行最長。
     取第一帶會被工具列或其他視窗的黃色元素騙走。 */
  var thr = mx*0.25, gapTol = Math.max(3, Math.round(ch*0.006));
  var bands=[], cur=null;
  for(var y=0;y<ch;y++){
    if(rc[y]>thr){
      if(!cur) cur={y0:y,y1:y,sum:rc[y]};
      else if(y-cur.y1<=gapTol){ cur.y1=y; cur.sum+=rc[y]; }
      else { bands.push(cur); cur={y0:y,y1:y,sum:rc[y]}; }
    }
  }
  if(cur) bands.push(cur);
  if(!bands.length) return {err:'no_header'};
  /* ⚠️ 不可取「黃色最多」的那條：HIS 的診斷欄也是藍綠底黃字，而且通常比標題列更長更多欄，
     取最大會抓到診斷欄、裡面根本沒有病歷號。病歷號那行永遠在最上面，因此由上往下逐條試。 */
  bands.sort(function(a,b){ return a.y0-b.y0 });
  var inv = 1/sc, obw = Math.round(img.width*0.55);   // 病歷號在姓名之後的左半，右半是生日與流水號
  var outs = [];
  for(var bi=0; bi<bands.length && outs.length<3; bi++){
    var bd = bands[bi], textHs = bd.y1-bd.y0+1;
    if(textHs < 3) continue;
    var padS = Math.round(textHs*0.35)+3;
    var oy0 = Math.max(0, Math.round((bd.y0-padS)*inv));
    var oy1 = Math.min(img.height, Math.round((bd.y1+padS)*inv));
    var obh = Math.max(1, oy1-oy0);
    var c = document.createElement('canvas'); c.width=obw; c.height=obh;
    c.getContext('2d').drawImage(img, 0,oy0,obw,obh, 0,0,obw,obh);
    outs.push({canvas:c, rawTextH: Math.round(textHs*inv)});
  }
  if(!outs.length) return {err:'no_header'};
  return {list:outs, canvas:outs[0].canvas, rawTextH:outs[0].rawTextH, bands:bands.length};
}
/* 黃字轉成深字白底，指定高度，可選模糊（壓 LCD 網點） */
function capPrep(band, blur, targetH){
  var sc = targetH/band.height;
  var w = Math.max(8, Math.round(band.width*sc));
  var c = document.createElement('canvas'); c.width=w+40; c.height=targetH+40;
  var ctx = c.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  if(blur && ctx.filter!==undefined) ctx.filter='blur('+blur+'px)';
  ctx.drawImage(band, 20, 20, w, targetH);
  ctx.filter='none';
  var d=ctx.getImageData(0,0,c.width,c.height), p=d.data, mn=255, mx=0, i, v, vals=new Float32Array(c.width*c.height);
  for(i=0;i<p.length;i+=4){
    v = p[i]*0.5 + p[i+1]*0.5 - p[i+2];       // 黃度：字高、底低
    vals[i>>2]=v; if(v<mn)mn=v; if(v>mx)mx=v;
  }
  var rng = Math.max(1, mx-mn);
  for(i=0;i<p.length;i+=4){
    v = 255 - (vals[i>>2]-mn)/rng*255;         // 反相 → 深字白底
    p[i]=p[i+1]=p[i+2]=v;
  }
  ctx.putImageData(d,0,0);
  return c;
}
function capExtract(text){
  var paren={}, m, re;
  re=/\((\d{5,10})\)/g; while((m=re.exec(text))) paren[m[1]]=1;   // 括號內是生日，永遠不是病歷號
  var br=[], any=[];
  re=/\[\s*(\d{5,10})\s*\]/g; while((m=re.exec(text))) br.push(m[1]);
  re=/\d{5,10}/g; while((m=re.exec(text))) if(!paren[m[0]]) any.push(m[0]);
  return {br:br, any:any};
}
function capAnalyse(band, variants){
  variants = variants || [[0,110],[0,150],[0.6,150],[1.0,150],[0,200],[1.2,200]];
  return capWorker().then(function(w){
    var seq=Promise.resolve(), brVotes={}, anyVotes={};
    variants.forEach(function(v){
      seq=seq.then(function(){ return w.recognize(capPrep(band,v[0],v[1])) }).then(function(r){
        var e=capExtract((r.data&&r.data.text)||'');
        e.br.forEach(function(d){brVotes[d]=(brVotes[d]||0)+1});
        e.any.forEach(function(d){anyVotes[d]=(anyVotes[d]||0)+1});
      }).catch(function(){});
    });
    return seq.then(function(){
      var best='', n=0, total=0, seen=[];
      for(var d in brVotes){ total+=brVotes[d]; seen.push(d+'×'+brVotes[d]); if(brVotes[d]>n){best=d;n=brVotes[d]} }
      var loose=[]; for(var a in anyVotes) loose.push(a+'×'+anyVotes[a]);
      loose.sort(function(x,y){ return Number(y.split('×')[1])-Number(x.split('×')[1]) });
      return {mrn:best, agree:n, dissent: total-n, seen:seen, loose:loose.slice(0,4)};
    });
  });
}
function capHandle(file){
  if(!file || CAP.busy) return;
  CAP.busy=true; CAP.tries++;
  $('#capResult').classList.remove('hid'); capSay('讀取影像…');
  var img=new Image();
  img.onload=function(){
    var b=capFindBand(img);
    if(b.err==='no_header'){
      $('#capBand').classList.add('hid');
      capFail('沒抓到病歷號那一行。請把畫面<b>最上方那條藍綠底、黃色字</b>的列拍進去（含方括號內的號碼）。');
      return;
    }
    var cands=(b.list||[{canvas:b.canvas,rawTextH:b.rawTextH}]).filter(function(x){return x.rawTextH>=CAP.HARD_MIN_TEXT_H});
    $('#capBand').classList.remove('hid');
    $('#capBand').src=(cands[0]||b.list[0]).canvas.toDataURL('image/png');
    CAP.lastTextH=(cands[0]||b.list[0]).rawTextH;
    if(!cands.length){
      capFail('偵測到的文字只有 '+CAP.lastTextH+'px 高，太小無法辨識。手機請<b>靠近</b>拍；電腦截圖前請先<b>放大畫面</b>再截。');
      return;
    }
    capSay('辨識中…');
    /* 由上往下逐條嘗試：第一條通常就是病歷號那行，不過則往下試診斷欄之外的其他橫帶 */
    var tried=0;
    var tryNext=function(i){
      if(i>=cands.length) return Promise.resolve(null);
      tried=i+1;
      return capAnalyse(cands[i].canvas).then(function(r){
        var lenOk=r.mrn && r.mrn.length>=CAP.MIN_DIGITS && r.mrn.length<=CAP.MAX_DIGITS;
        if(lenOk && r.agree>=CAP.MIN_AGREE && (!CAP.NO_DISSENT || r.dissent===0)){
          $('#capBand').src=cands[i].canvas.toDataURL('image/png');
          CAP.lastTextH=cands[i].rawTextH; r.hit=true; return r;
        }
        return tryNext(i+1).then(function(nxt){ return nxt || r });
      });
    };
    tryNext(0).then(function(res){
      res = res || {mrn:'', agree:0, dissent:0, seen:[], loose:[]};
      var solid = !!res.hit;
      if(solid){
        /* 讀得夠穩也不直接填：病歷號填錯等於掛錯病人，一律要醫師對照畫面按一次確認 */
        CAP.pending=res.mrn; $('#capConfirm').classList.remove('hid');
        capSay('讀到病歷號 <b>'+esc(res.mrn)+'</b><br><span style="font-size:.9rem">請對照上方影像確認每一位數字，正確再按「核對無誤，填入」。</span>','ok');
        CAP.tries=0;
      } else {
        CAP.pending=''; $('#capConfirm').classList.add('hid');
        var hint = !res.mrn ? '在偵測到的 '+cands.length+' 條標題列裡，都沒有在方括號內讀到號碼。'
                 : (res.dissent>0 ? '辨識結果<b>不一致</b>（'+esc(res.mrn)+' 只得 '+res.agree+' 票），不可靠。'
                                  : '只有 '+res.agree+' 組結果一致（需 '+CAP.MIN_AGREE+' 組），不夠可靠。');
        var how = (CAP.lastTextH && CAP.lastTextH < CAP.SMALL_TEXT_H)
          ? '字太小（'+CAP.lastTextH+'px，建議 12px 以上）。截圖前先放大畫面：遠端桌面請調高解析度或用 Windows 放大鏡（按 ⊞ 和 +）放到 150～200% 再截；手機請靠近拍。'
          : '請重拍：手機與螢幕<b>平行</b>、更靠近、避開反光與手震。<br>用電腦 <b>Win+Shift+S</b> 截圖再貼上最準。';
        var diag = '<br><span style="font-size:.8rem;opacity:.8">診斷：試了 '+tried+'/'+cands.length+' 條橫帶，文字高 '+(CAP.lastTextH||'?')+'px'
                 + (res.seen&&res.seen.length ? '；括號內讀到 '+esc(res.seen.join('、')) : '；括號內沒讀到數字')
                 + (res.loose&&res.loose.length ? '；其他數字 '+esc(res.loose.join('、')) : '') + '</span>';
        capFail(hint+'為避免填錯病人，<b>不會自動填入</b>。<br>'+how+diag);
      }
    }).catch(function(e){ capFail('辨識失敗：'+esc(e.message||e)+'　可改用手動輸入。') })
    .finally(function(){ CAP.busy=false });
  };
  img.onerror=function(){ CAP.busy=false; capFail('影像讀取失敗，請重試。') };
  img.src=URL.createObjectURL(file);
}
function capFail(msg){
  CAP.busy=false; CAP.pending=''; $('#capConfirm').classList.add('hid');
  var extra = CAP.tries>=2 ? '<br><span style="font-size:.85rem">已重試 '+CAP.tries+' 次，建議直接手動輸入病歷號。</span>' : '';
  capSay('<b>請再拍一次</b><br>'+msg+extra,'bad');
  if(CAP.tries>=2) $('#mrn').focus();
}
$('#capFile').onchange=function(){ var f=this.files&&this.files[0]; this.value=''; capHandle(f) };
$('#capRetry').onclick=function(){ CAP.pending=''; $('#capConfirm').classList.add('hid'); capSay('請重新拍攝或貼上截圖…'); $('#capFile').click() };
$('#capManual').onclick=function(){ $('#capResult').classList.add('hid'); CAP.tries=0; CAP.pending=''; $('#mrn').classList.remove('mrn-ocr'); $('#mrn').focus() };
$('#capConfirm').onclick=function(){
  if(!CAP.pending) return;
  $('#mrn').value=CAP.pending; $('#mrn').classList.add('mrn-ocr'); validate();
  $('#capConfirm').classList.add('hid');
  capSay('已填入 <b>'+esc(CAP.pending)+'</b>　送出前請再看一眼。','ok');
  CAP.pending='';
};
document.addEventListener('paste',function(e){
  var items=(e.clipboardData||{}).items||[];
  for(var i=0;i<items.length;i++) if(items[i].type.indexOf('image')===0){ e.preventDefault(); capHandle(items[i].getAsFile()); return; }
});
$('#mrn').addEventListener('input',function(){ this.classList.remove('mrn-ocr') });

renderRecent();renderList();renderQueue();renderDoc();validate();
if(!docToken())openDocDialog();
if(typeof Tesseract !== 'undefined'){
  setTimeout(function(){ capWorker().catch(function(){}) }, 1500);   // 預熱，第一次拍照才不用等引擎下載
}else{
  $('#capHint').innerHTML='⚠️ 辨識元件未載入（首次使用需連一次網路）。可直接手動輸入病歷號。';
  $('#capFile').disabled=true; document.querySelector('.btn-cap').style.opacity='.5';
}
